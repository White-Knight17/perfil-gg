<div
  #preloaderRef
  class="preloader-overlay fixed inset-0 z-[9999] flex items-center justify-center"
  role="status"
  aria-live="polite"
  aria-label="Cargando el portafolio"
>
  <div class="preloader-inner">
    <div #avatarWrapperRef class="preloader-mark">
      <span #pulseRef class="preloader-pulse" aria-hidden="true"></span>
      <div class="preloader-monogram">GG</div>
    </div>

    <h1 #nameRef class="preloader-name">German Giorgio</h1>
    <p #titleRef class="preloader-title">Desarrollador Full-Stack</p>

    <div class="preloader-bar" aria-hidden="true">
      <span></span>
    </div>
  </div>
</div>
